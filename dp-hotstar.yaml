apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydp
  labels:
    app: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: my-container1
          image: basavaraj1234/hotstar
          ports:
            - containerPort: 3000

